[package]
name = "sp1-metal-prover"
version = "1.0.0"
edition = "2021"
authors = ["Hashberg Ltd"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/hashberg-io/sp1-metal"
description = "A Metal implementation of the logup GKR round reduction, against the forked sp1-hypercube seam."
publish = false

# Outside the workspace: it depends on the fork in crates/vendor, which in turn
# pulls the SP1 dependency tree.

[dependencies]
rand = "0.8"
rayon = "1.10"
serde_json = "1"
slop-algebra = "=6.4.0"
slop-alloc = "=6.4.0"
slop-koala-bear = "=6.4.0"
slop-multilinear = "=6.4.0"
slop-sumcheck = "=6.4.0"
slop-tensor = "=6.4.0"
sp1-hypercube = { version = "=6.4.0", features = ["metal"] }
slop-dft = { version = "=6.4.0", features = ["metal"] }

[profile.release]
lto = "thin"

[patch.crates-io]
sp1-hypercube = { path = "../vendor/sp1-hypercube" }
slop-jagged = { path = "../vendor/slop-jagged" }
slop-multilinear = { path = "../vendor/slop-multilinear" }
slop-basefold-prover = { path = "../vendor/slop-basefold-prover" }
slop-dft = { path = "../vendor/slop-dft" }
p3-uni-stark = { path = "../vendor/p3-uni-stark" }
