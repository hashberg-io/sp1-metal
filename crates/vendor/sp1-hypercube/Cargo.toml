    "cfg(sp1_debug_constraints)",
    "cfg(sp1_debug_global_memory)",
    "cfg(sp1_core_runner_override)",
    "cfg(sp1_use_native_executor)",
    "cfg(sp1_use_portable_executor)",
    "cfg(sp1_native_executor_available)",
]

# crates.io packaging drops dev-dependencies, so the crate as published
# cannot build its own tests. Restored, because those tests are how this fork
# proves its changes leave the CPU path alone.
[dev-dependencies]
rand = "0.8"

# This crate's `metal` feature names `slop-jagged/metal`, which the published
# slop-jagged does not have, so without this the crate cannot resolve its own
# dependencies when built on its own -- and building it on its own is how the
# restored tests above get run. Consumers patch the same set one level up.
[patch.crates-io]
slop-jagged = { path = "../slop-jagged" }
slop-multilinear = { path = "../slop-multilinear" }
slop-basefold-prover = { path = "../slop-basefold-prover" }
slop-dft = { path = "../slop-dft" }
