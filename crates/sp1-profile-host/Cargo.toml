[package]
name = "sp1-profile-host"
version = "0.1.0"
edition = "2021"
description = "Minimal SP1 CPU-prover host that emits span timings for tools/span_profile.py."
publish = false

# Deliberately outside the workspace: sp1-sdk pulls a very large dependency
# tree, and this host is only built for profiling runs.

[dependencies]
anyhow = "1"
bincode = "1.3.3"
sp1-sdk = "=6.4.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Prove through the fork in crates/vendor, not the published crate, so that
# what this host measures is what this project builds.
[patch.crates-io]
sp1-hypercube = { path = "../vendor/sp1-hypercube" }
