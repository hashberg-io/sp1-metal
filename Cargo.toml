[workspace]
resolver = "2"
members = ["crates/sp1-metal-core", "crates/sp1-metal-probes", "crates/sp1-metal-kernelbench"]
exclude = ["crates/sp1-profile-host", "crates/sp1-metal-transpile", "crates/vendor/sp1-hypercube", "crates/sp1-metal-prover"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
slop-algebra = "=6.4.0"
slop-alloc = "=6.4.0"
slop-challenger = "=6.4.0"
slop-commit = "=6.4.0"
slop-dft = "=6.4.0"
sp1-metal-core = { path = "crates/sp1-metal-core" }
slop-merkle-tree = "=6.4.0"
slop-koala-bear = "=6.4.0"
slop-multilinear = "=6.4.0"
slop-sumcheck = "=6.4.0"
slop-symmetric = "=6.4.0"
slop-tensor = "=6.4.0"
metal = "0.29"
rand = "0.8"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
